library:
  name: '@relayboard/skills'
  version: 0.1.0
domains:
  - slug: messaging-replay
    summary: >-
      Reading, ordering and resuming a thread's chronology: the four entry
      kinds in one sequence, the delivery cursor versus the seen and
      acknowledged watermarks, replay after a pause, idempotent re-sends.
  - slug: api-contract
    summary: >-
      Calling the app's RelayboardClient: the operation vocabulary, the
      permission each operation requires, the entry kinds one chronology holds,
      the refusal families, demo-origin content and the purge, and the
      guarantees the in-memory store omits.
  - slug: identity-provenance
    summary: >-
      Authoring and provenance: one principal model for humans and agents,
      durable identity versus display name, the agent chip, and the claims an
      identity view must not make.
skills:
  - name: relayboard-thread-sequencing
    slug: relayboard-thread-sequencing
    domain: messaging-replay
    description: >-
      Order thread reads by the immutable per-thread sequence, keep delivery
      cursors separate from read watermarks, catch up with
      readMessages({ after }), and retry with the original idempotency key.
    tasks:
      - 'Read a thread in canonical order after a reconnect'
      - 'Persist and advance a per-thread delivery cursor while catching up'
      - 'Explain why unread counts and delivery cursors differ'
      - 'Retry a send without appending a duplicate entry'
    covers:
      - 'per-thread seq assignment in the one entry-writing path'
      - 'the four entry kinds sharing one chronology'
      - 'readMessages({ after }) and readThread cursor semantics'
      - 'the delivery cursor versus the seen and acknowledged watermarks'
      - 'idempotencyKey deduplication'
    failure_modes:
      - 'Advancing the cursor before the entry is handled'
      - 'Sharing one cursor across threads'
      - 'Ordering by createdAt or array position'
      - 'Excluding the readers own entries from the unread count'
      - 'Claiming replay the in-memory store does not implement'
  - name: relayboard-mock-api
    slug: relayboard-mock-api
    domain: api-contract
    description: >-
      Call RelayboardClient with the right payload shapes, ask for the
      permission each operation needs before rendering a control, narrow entries
      by kind, render refusals by their family, and avoid assuming guarantees
      the in-memory store excludes.
    tasks:
      - 'List boards and threads through RelayboardClient'
      - 'Append an entry with an idempotency key and handle the documented errors'
      - 'Add a resource and attach it to a thread without copying its content'
      - 'Purge demo content without touching what the reader made'
    covers:
      - 'the operation vocabulary and what each requires'
      - 'the three requirement shapes and which one a workspace permission needs'
      - 'the Entry union and its four kinds'
      - 'verbatim refusal strings, their families and their check order'
      - 'idempotency lookup ordering ahead of validation'
      - 'demo origin, the purge overlap, and the in-memory store'
    failure_modes:
      - 'Passing an author, which the superceded appendMessage signature did'
      - 'Naming a workspace permission with the board-shaped requirement'
      - 'Treating every entry as prose and casting instead of narrowing'
      - 'Calling methods that do not exist (updateMessage, delete*, auth)'
  - name: relayboard-identity
    slug: relayboard-identity
    domain: identity-provenance
    description: >-
      Resolve authorship through the principal id and kind, mark agents only
      with the AGENT chip, handle the unknown-principal fallback, and keep
      provenance free of verification, permission and execution claims.
    tasks:
      - 'Render an entry byline with author, kind, time and sequence'
      - 'Distinguish a human author from an agent author without inspecting text'
      - 'Show the grant a principal holds on one board'
      - 'Show a derived issuer and fingerprint apart from what a principal declared'
      - 'Review copy that could imply an agent was verified or authorised'
    covers:
      - 'the shared principal record for humans and agents'
      - 'byline, people list and participant panel rendering'
      - 'the board-scoped principal read (readPrincipal) and its read:member gate'
      - 'derived versus declared, and the absent derivation for a seeded principal'
      - 'the three progress readouts rather than one bar'
      - 'product exclusions for execution, tasks and orchestration'
    failure_modes:
      - 'Treating issuer or fingerprint as a verification of the principal claims'
      - 'Labelling a declared value verified, or merging derived with declared'
      - 'Inventing a derived value for a principal never admitted'
      - 'Showing agent runtime, tool or task state on the board'
      - 'Reading an entry as an approval or permission grant'
      - 'Adding a second visual channel for agents beyond the chip'
      - 'Substituting a hard-coded id list for the principal read the app now has'
gaps:
  - >-
    CLOSED. `window.RelayboardMockAPI` exposed no principal read, so `kind`,
    `issuer` and `fingerprint` were unreachable from consumer code and this
    package's `relayboard-identity` skill was excluded from the app's Intent
    allowlist. The port's ticket 12 shipped `readPrincipal` — one board-scoped
    read gated by `read:member` — and 15c removed the exclusion. What the skill
    still may not claim is recorded in its body: a credential identifies rather
    than authenticates, so a derived fingerprint is evidence about this
    workspace's record and never about the principal's honesty.
  - >-
    Accessibility behaviour of the byline and composer is still not a skill in
    this package. It is now asserted rather than documented: the app's
    `e2e/keyboard.spec.ts` and `e2e/geometry.spec.ts` own focus order, the focus
    ring's colour per surface, the live region for arriving entries, and the type
    and contrast floors. Recorded as a deliberate boundary rather than a gap: a
    skill that restated those assertions would be a second source that drifts.
