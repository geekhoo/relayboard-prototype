# app-check.yml — hand-written; unlike check-skills.yml this is not copied by
# `intent maintainer setup`, so edits here are permanent.
#
# Why this file exists: check-skills.yml is the repository's other workflow and it
# only validates the Intent skills package. Nothing ran apps/relayboard-web's own
# gates, so a broken app could merge green. This workflow runs the app's own gates —
# `npm run check` (biome), `npm run check:styles`, `npm run typecheck` (`tsc --noEmit`),
# `npm test` (Vitest in Node), `npm run build` (vite → Nitro), `npm run check:boot` and
# `npm run e2e` (Playwright against the built server) — on every pull request and on demand.
#
# Hand notes worth keeping:
#
#   * The last step asserts how the build was produced. apps/relayboard-web/vite.config.ts
#     pins `nitro({ preset: "node-server" })` deliberately: the app's store is in-memory
#     and its SSE stream is long-lived, so it needs exactly one long-running process.
#     A serverless or horizontally scaled target would build green and only fail at
#     runtime, so a Vercel build environment — or any other accident that changes the
#     preset — must fail here rather than ship. The step reads .output/nitro.json and
#     requires `preset` to be exactly "node-server", and it also fails if a .vercel
#     directory exists.
#
#   * The `typecheck` and `check:styles` scripts in apps/relayboard-web/package.json
#     came in a parallel change and the steps below call them, not the raw commands.
#     If a step fails with "Missing script", the manifest lost them: fall back to
#     `npx tsc --noEmit` for typecheck, and drop the check:styles step (`check:styles`
#     runs scripts/check-app-styles.mjs at the repository root, which needs a checkout,
#     not the app's node_modules).
#
#   * actions/checkout and actions/setup-node are pinned to the commit of their
#     current major tags (v7.0.1 and v7.1.0). Dependabot or Renovate bumps the pin
#     like any other action reference; a `github-actions` entry in
#     .github/dependabot.yml is enough. The job grants only `contents: read`.

name: App Check

on:
  pull_request: {}
  workflow_dispatch: {}

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/relayboard-web
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/relayboard-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint (biome)
        run: npm run check

      - name: Check design-token usage in styles
        run: npm run check:styles

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # The suite is the app's main guardrail: the store, contract and client seams. It
        # runs in Node with no DOM and no network, so it needs nothing this workflow has
        # not already installed.
        run: npm test

      - name: Build
        run: npm run build

      # Runs AFTER the build for the same reason the preset assertion below does: the guard it
      # checks lives in the built entry, so there is nothing to import until the build exists.
      # It imports the entry in a fresh process three times — with no SESSION_SECRET, with a
      # secret that is present but too short, and with a usable one — and requires a fatal exit
      # and a named variable in the first two and a clean load in the third. A guard that always
      # threw would fail the third, which is what stops this being a check of nothing.
      #
      # Why a script and not a test: the app's `npm test` is a hermetic Node suite over src/**
      # with no build, and a build is neither fast nor hermetic. Recording the split where it is
      # made, because "why is this not in the test run" is the first question a reader asks.
      - name: Assert the server refuses to serve without a session secret
        run: npm run check:boot

      # The mirror of check:boot, and the reason it exists: a module-scope side effect in a
      # server module shipped inside the browser bundle in 04b and stopped React hydrating.
      # Every other gate was green, because every other gate measures the server or the
      # source. This one reads the built client assets and fails if the session secret's
      # name, its guard, or a Node built-in appears in them.
      - name: Assert no server-only code reached the client bundle
        run: npm run check:bundle

      # The route seam. Two steps because the browser download is the slow, cacheable half and the
      # run is the fast, failing half — a failure then names which one it was.
      #
      # `--with-deps` is what makes this work on a bare runner: Playwright's Chromium needs system
      # libraries ubuntu-latest does not ship, and installing the browser without them produces a
      # launch failure that reads like an app bug.
      - name: Install the browser for the route seam
        run: npx playwright install --with-deps chromium

      # `RELAYBOARD_E2E_REUSE_BUILD` is the whole reason this step sits AFTER the build: the
      # artefacts the steps above produced are the artefacts under test, and a harness that built
      # again would be testing something the preset assertion never saw. The config fails loudly if
      # reuse is requested and .output is missing, rather than quietly building.
      #
      # SESSION_SECRET is supplied here rather than inherited, for the same reason check:boot
      # supplies its own: the server refuses to serve without one, and a gate should not depend on
      # a value that happens to be in the runner's environment. RELAYBOARD_TEST_MODE unlocks the
      # reset hook, which every test uses to start from the seed.
      - name: Assert the route seam in a real browser
        env:
          RELAYBOARD_E2E_REUSE_BUILD: "1"
          SESSION_SECRET: e2e-session-secret-0123456789abcdef
        run: npm run e2e

      # A trace is only useful if a developer can open it, and a failed CI run cannot be re-run
      # interactively. Uploaded on failure only: a green run's traces are noise in the artefact
      # list, and this file keeps none of them in the repository.
      - name: Keep the route seam's failure evidence
        if: failure()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: route-seam-report
          path: |
            apps/relayboard-web/test-results
            apps/relayboard-web/playwright-report
          retention-days: 7

      - name: Assert the build stayed a long-running Node server
        run: |
          # The in-memory store and the long-lived SSE stream need a single
          # long-running process, so a serverless build must fail here rather
          # than ship and fail at runtime.
          # .vercel is written next to the project Vercel was run in: the app
          # directory, or the repository root when the CLI ran from there.
          for dir in . "${GITHUB_WORKSPACE:-..}"; do
            if [ -e "$dir/.vercel" ]; then
              echo "::error::$dir/.vercel exists: the app must build as one long-running Node process."
              exit 1
            fi
          done

          if [ ! -f .output/nitro.json ]; then
            echo "::error::.output/nitro.json is missing: the build produced no server output."
            exit 1
          fi

          # A preset is either a string ("node-server", "vercel") or, when Nitro
          # cannot decide, a { name, ... } object. Compare the resolved name so
          # neither shape can slip past the check.
          preset=$(node -p 'const preset = require("./.output/nitro.json").preset; typeof preset === "string" ? preset : String(preset && preset.name)')

          if [ "$preset" != "node-server" ]; then
            echo "::error::Nitro preset is '$preset', expected 'node-server': the in-memory store and the long-lived SSE stream need one long-running process."
            exit 1
          fi

          echo "Nitro preset is $preset."
